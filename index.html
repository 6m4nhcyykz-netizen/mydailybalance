<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Daily Balance"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#2f8f68"><title>My Daily Balance</title>
<style>
:root{--bg:#f4f7f5;--cd:#fff;--tx:#1c2a24;--mu:#74827b;--ac:#2f8f68;--al:#e0f0e8;--ln:#e6ebe8;--wa:#3b82c4;--rd:#c0584f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121816;--cd:#1c2421;--tx:#edf3ef;--mu:#8b9892;--ac:#5cbb90;--al:#223a2f;--ln:#2a3530}}
:root[data-theme=dark]{--bg:#121816;--cd:#1c2421;--tx:#edf3ef;--mu:#8b9892;--ac:#5cbb90;--al:#223a2f;--ln:#2a3530}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}#main{flex:1;overflow-y:auto;padding-bottom:20px}
nav{display:flex;overflow-x:auto;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:0 0 auto;min-width:88px;border:0;background:none;color:var(--mu);padding:7px 6px;font:11px inherit;font-family:inherit}nav button.on{color:var(--ac);font-weight:700}nav .ic{display:block;margin:0 auto 3px;width:22px;height:22px}
h1{font-size:26px;margin:0}h3{margin:0 0 8px}.top{padding:14px 16px 2px}
.c{background:var(--cd);border-radius:16px;padding:14px;margin:10px 14px}
.mu{color:var(--mu);font-size:13px}.big{font-size:34px;font-weight:700;line-height:1.1}
.bar{height:9px;background:var(--ln);border-radius:9px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
button{font-family:inherit}.btn{border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:16px;padding:12px 14px;min-height:48px;text-align:center;display:block;width:100%}
.btn.s{background:var(--al);color:var(--ac)}.btn.d{background:none;color:var(--rd)}.btn.q{width:auto;display:inline-block;min-height:40px;padding:8px 14px;margin:2px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
input,select,textarea{width:100%;font:16px inherit;font-family:inherit;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}.ch{display:inline-block;padding:8px 12px;border-radius:20px;background:var(--bg);margin:2px;color:var(--tx);font-size:14px}.ch input{display:none}.ch:has(input:checked),.ch.on{background:var(--ac);color:#fff}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--ln);background:none;font-size:22px;color:#fff;flex:none}.chk.on{background:var(--ac);border-color:var(--ac)}
#sh{display:none;position:fixed;inset:0;z-index:20}.bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}.sh{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--cd);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.nt{background:var(--al);border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}.bn{background:#fff3d6;color:#6b4a00;border-radius:12px;padding:9px 12px;margin:8px 14px;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%;text-align:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg b{font-size:11px;color:var(--mu)}.cd{aspect-ratio:1;border-radius:10px;border:0;background:var(--bg);color:var(--tx);font-size:13px}.cd.dn{background:var(--ac);color:#fff}.cd.ms{background:var(--al);color:var(--mu)}.cd.td{outline:2px solid var(--ac)}.cd.ft{opacity:.35}
.cx{display:flex;align-items:flex-end;gap:2px;height:110px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bv{width:100%;background:var(--ac);border-radius:4px 4px 0 0}.col small{font-size:9px;color:var(--mu)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}.btn:not(.q) .ic{margin-right:6px}.fl .ic{width:24px;height:24px;color:var(--ac)}
</style></head><body><div id="app"><div id="main">Lade …</div><nav id="nav"></nav></div><div id="sh"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)},today=()=>ymd(new Date()),hm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),DN=['So','Mo','Di','Mi','Do','Fr','Sa'],sum=(a,k)=>a.reduce((x,y)=>x+(+y[k]||0),0),val=id=>document.getElementById(id).value,M=[3,7,14,30,60,100];
let S,tab=0,vd=today(),cal={m:'m',o:0},met='kcal',rng=7,W,WID,stErr='';
const KEY='mdb1';
function demo(){const t=today(),h1={id:'dh1',name:'Lesen (Demo)',desc:'20 Minuten',days:[0,1,2,3,4,5,6],time:'21:00',active:true,created:addD(t,-6),demo:1},h2={id:'dh2',name:'Gym (Demo)',desc:'',days:[1,3,5],time:'',active:true,created:addD(t,-6),demo:1},L1={};[1,2,3,4,5].forEach(i=>L1[addD(t,-i)]=true);
return{demoOn:1,goals:{kcal:2000,p:120,c:220,f:65,water:2500},meals:[{id:'dm1',date:t,time:'08:00',type:'Frühstück',name:'Haferflocken mit Joghurt (Demo)',kcal:420,p:22,c:60,f:10,demo:1},{id:'dm2',date:t,time:'12:30',type:'Mittagessen',name:'Hähnchen mit Reis (Demo)',kcal:610,p:45,c:70,f:14,demo:1}],favs:[],water:[{id:'dw1',date:t,time:'09:00',ml:250,demo:1},{id:'dw2',date:t,time:'11:00',ml:330,demo:1}],workouts:[],habits:[h1,h2],logs:{dh1:L1,dh2:{}},rem:[],wt:[],wg:{start:null,goal:null}}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){stErr='Speicher nicht verfügbar – Daten gehen beim Schließen verloren.'}if(!S)S=demo();S.wt=S.wt||[];S.wg=S.wg||{start:null,goal:null}}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){stErr='Speichern nicht möglich.'}idbPut(j)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function sheet(h){$('#sh').innerHTML='<div class=bd onclick="closeS()"></div><div class=sh>'+h+'</div>';$('#sh').style.display='block'}
function closeS(){$('#sh').style.display='none';$('#sh').innerHTML=''}
function done(){save();closeS();render()}
const mealsOn=d=>S.meals.filter(m=>m.date===d),waterOn=d=>sum(S.water.filter(w=>w.date===d),'ml'),pct=(v,g)=>Math.min(100,g?v/g*100:0),dl=d=>parse(d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const bar=(v,g,c)=>`<div class=bar><i style="width:${pct(v,g)}%;${c?'background:'+c:''}"></i></div>`,mac=(l,v,g)=>`<div class=mu>${l}: ${Math.round(v)} / ${g} g</div>${bar(v,g)}`;
/* Streaks */
function streak(h){const L=S.logs[h.id]||{},t=today(),ks=Object.keys(L).filter(k=>L[k]).sort();let st=h.created;if(ks[0]&&ks[0]<st)st=ks[0];let cur=0,lng=0,dn=0,pl=0;for(let d=st;d<=t;d=addD(d,1)){const sc=h.days.includes(parse(d).getDay()),x=!!L[d];if(x)dn++;if(!sc)continue;if(x){cur++;pl++;lng=Math.max(lng,cur)}else if(d<t){cur=0;pl++}}return{cur,lng,dn,pl}}
function rate7(h){const L=S.logs[h.id]||{},t=today();let p=0,d=0;for(let i=0;i<7;i++){const k=addD(t,-i);if(k<h.created&&!L[k])continue;if(!h.days.includes(parse(k).getDay()))continue;if(k===t&&!L[k])continue;p++;if(L[k])d++}return p?Math.round(d/p*100):null}
function tog(id,d){d=d||today();if(d>today())return;const L=S.logs[id]=S.logs[id]||{};L[d]=!L[d];save();const h=S.habits.find(x=>x.id===id),s=streak(h);if(L[d]&&M.includes(s.cur)&&d===today())toast('Meilenstein: '+s.cur+' Tage Streak – '+h.name);render()}
/* Views */
function heute(){const t=today(),tw=S.wt.find(x=>x.date===t),ms=mealsOn(t),k=sum(ms,'kcal'),G=S.goals,w=waterOn(t),wo=S.workouts.filter(x=>x.date===t),hs=S.habits.filter(h=>h.active),sc=hs.filter(h=>h.days.includes(new Date().getDay())),dn=sc.filter(h=>(S.logs[h.id]||{})[t]).length;
return`<div class=top><h1>Heute</h1><div class=mu>${dl(t)}</div></div>${S.demoOn?'<div class=bn>Demo-Daten: Beispielwerte, keine echten Daten. <b onclick="clearDemo()" style="text-decoration:underline">Demo entfernen</b></div>':''}${stErr?'<div class=bn>'+stErr+'</div>':''}
<div class=c><div class=mu>Kalorien (Schätzung aus deinen Einträgen)</div><div class=big>${Math.round(k)} <span class=mu>/ ${G.kcal} kcal</span></div>${bar(k,G.kcal)}<div class=mu>${k<=G.kcal?'Noch '+Math.round(G.kcal-k)+' kcal als Orientierung':Math.round(k-G.kcal)+' kcal über dem Ziel – ein Tag ist kein Maßstab'}</div><br>${mac('Eiweiß',sum(ms,'p'),G.p)}${mac('Kohlenhydrate',sum(ms,'c'),G.c)}${mac('Fett',sum(ms,'f'),G.f)}</div>
<div class=c><div class=g><label class="btn s" style="margin:0">${ic('camera')}Essen fotografieren<input type=file accept="image/*" style="display:none" onchange="photo(event)"></label><button class="btn s" onclick="mealForm()">${ic('pencil')}Essen manuell</button><button class="btn s" onclick="waterSheet()">${ic('droplet')}Wasser</button><button class="btn s" onclick="wEdit()">${ic('dumbbell')}Training</button><button class="btn s" onclick="go(3)">${ic('list')}Abhaken</button><button class="btn s" onclick="hForm()">${ic('plus')}Neue Routine</button></div></div>
<div class=c><b>${ic('scale')} Körpergewicht</b>${tw?`<div class=row><span><b>${fk(tw.kg)} kg</b> <span class=mu>heute eingetragen</span></span><button class="btn s q" onclick="wtForm('${tw.id}')">${ic('pencil')}</button></div>`:`<div class=nt>Noch kein Wiegeeintrag für heute. Trage dein Gewicht ein, sobald du dich gewogen hast.</div><div class=row style="border:0"><input id=wi inputmode=decimal placeholder="z. B. 82,4" style="margin:0"><button class="btn q" onclick="saveWt(today(),val('wi'))">Speichern</button></div>`}${wsum()}</div><div class=c><b>${ic('droplet')} Wasser</b> <span class=mu>${w} / ${G.water} ml</span>${bar(w,G.water,'var(--wa)')}<button class="btn s q" onclick="addW(250)">+250 ml</button><button class="btn s q" onclick="addW(500)">+500 ml</button></div>
<div class=c><b>Gewohnheiten</b> <span class=mu>${dn} von ${sc.length} heute geplant erledigt</span><div class=row><span>Wiegen</span><button class="chk ${tw?'on':''}" onclick="${tw?'':"document.getElementById('wi').focus()"}">${tw?'✓':''}</button></div>${hs.length?hs.map(h=>{const on=(S.logs[h.id]||{})[t],s=streak(h);return`<div class=row><span>${esc(h.name)} <span class=mu>${ic('flame')}${s.cur}</span></span><button class="chk ${on?'on':''}" onclick="tog('${h.id}')">${on?'✓':''}</button></div>`}).join(''):'<p class=mu>Noch keine Gewohnheit. Lege die erste an.</p>'}</div>
<div class=c><b>Training heute</b>${wo.length?wo.map(w=>`<div class=row><span>${esc(w.type)} · ${w.dur} min</span><span class=mu>${vol(w)} kg Volumen</span></div>`).join(''):'<p class=mu>Noch kein Training eingetragen.</p>'}</div>
<div class=c><b>Mahlzeiten</b>${ms.length?ms.map(m=>`<div class=row><span>${m.time} ${esc(m.name)}</span><span>${m.kcal} kcal</span></div>`).join(''):'<p class=mu>Noch nichts eingetragen.</p>'}</div>
<div class=c><b>Tagesüberblick</b><p>${dn} von ${sc.length} geplanten Gewohnheiten erledigt, ${w} von ${G.water} ml getrunken${ms.length?', '+Math.round(k)+' kcal erfasst':''}. Beständigkeit zählt mehr als Perfektion.</p></div>`}
const TYPES=['Frühstück','Mittagessen','Abendessen','Snack'],guess=()=>{const h=new Date().getHours();return h<10?TYPES[0]:h<15?TYPES[1]:h<18?TYPES[3]:TYPES[2]};
function ern(){const ms=mealsOn(vd),G=S.goals,k=sum(ms,'kcal'),ws=S.water.filter(w=>w.date===vd);
return`<div class=top><h1>Ernährung</h1></div><div class=c><div class=row><button class="btn s q" onclick="vd=addD(vd,-1);render()">‹</button><b>${dl(vd)}</b><button class="btn s q" onclick="vd=addD(vd,1);render()">›</button></div><div class=big>${Math.round(k)} <span class=mu>/ ${G.kcal} kcal</span></div>${bar(k,G.kcal)}<div class=mu>P ${Math.round(sum(ms,'p'))} g · KH ${Math.round(sum(ms,'c'))} g · F ${Math.round(sum(ms,'f'))} g. Alle Werte sind Schätzungen.</div></div>
<div class=c><div class=g><label class="btn" style="margin:0">${ic('camera')}Foto<input type=file accept="image/*" style="display:none" onchange="photo(event)"></label><button class=btn onclick="mealForm()">${ic('pencil')}Manuell</button></div><input placeholder="Suche in bisherigen Mahlzeiten" oninput="srch(this.value)" style="margin-top:10px"><div id=sr></div>${S.favs.length?'<div class=mu>Favoriten</div>'+S.favs.map((f,i)=>`<button class="btn s q" onclick="reuseF(${i})">${ic('star')}${esc(f.name)}</button>`).join(''):''}</div>
${TYPES.map(ty=>{const l=ms.filter(m=>m.type===ty);return`<div class=c><b>${ty}</b> <span class=mu>${Math.round(sum(l,'kcal'))} kcal</span>${l.map(m=>`<div class=row onclick="mealForm('${m.id}')"><span>${m.time} ${esc(m.name)}<br><span class=mu>P ${m.p} · KH ${m.c} · F ${m.f}</span></span><span>${m.kcal} kcal</span></div>`).join('')||'<p class=mu>Leer</p>'}</div>`}).join('')}
<div class=c><b>${ic('droplet')} Wasser</b> <span class=mu>${waterOn(vd)} / ${G.water} ml</span>${bar(waterOn(vd),G.water,'var(--wa)')}<button class="btn s" onclick="waterSheet()">Wasser eintragen</button>${ws.map(w=>`<div class=row><span>${w.time} · ${w.ml} ml</span><span><button class="btn s q" onclick="editW('${w.id}')">${ic('pencil')}</button><button class="btn d q" onclick="delW('${w.id}')">${ic('x')}</button></span></div>`).join('')}</div>`}
function srch(v){v=v.toLowerCase().trim();const seen={},r=[];[...S.favs,...S.meals].forEach(m=>{if(v&&m.name.toLowerCase().includes(v)&&!seen[m.name]){seen[m.name]=1;r.push(m)}});S._r=r.slice(0,5);$('#sr').innerHTML=S._r.map((m,i)=>`<button class="btn s" style="margin:4px 0" onclick="reuseR(${i})">${esc(m.name)} · ${m.kcal} kcal</button>`).join('')}
const reuseR=i=>reuse(S._r[i]),reuseF=i=>reuse(S.favs[i]),reuse=m=>mealForm(null,null,{...m,id:undefined,demo:undefined,date:vd,time:hm()});
function photo(e){const f=e.target.files[0];if(!f)return;mealForm(null,URL.createObjectURL(f))}
function mealForm(id,img,pre){const m=S.meals.find(x=>x.id===id)||pre||{date:vd,time:hm(),type:guess(),name:'',kcal:'',p:'',c:'',f:''};
sheet(`<h3>${id?'Mahlzeit bearbeiten':'Mahlzeit hinzufügen'}</h3>${img?`<img src="${img}" onerror="this.remove()" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px"><div class=nt>Demo: Es ist keine KI angebunden. Das Foto wurde nicht analysiert, nicht gespeichert und nicht gesendet. Trage die Werte bitte selbst ein.</div>`:''}<div class=nt>Nährwerte sind Schätzungen. Öl, Saucen und Mengen sieht man auf Fotos oft nicht.</div>
<label>Name</label><input id=mn value="${esc(m.name)}"><label>Mahlzeit</label><select id=mt>${TYPES.map(t=>`<option ${t===m.type?'selected':''}>${t}</option>`).join('')}</select><div class=g><div><label>Datum</label><input id=md type=date value="${m.date}"></div><div><label>Uhrzeit</label><input id=mh type=time value="${m.time}"></div><div><label>Kalorien (kcal)</label><input id=mk type=number inputmode=decimal value="${m.kcal}"></div><div><label>Eiweiß (g)</label><input id=mp type=number inputmode=decimal value="${m.p}"></div><div><label>Kohlenhydrate (g)</label><input id=mc type=number inputmode=decimal value="${m.c}"></div><div><label>Fett (g)</label><input id=mf type=number inputmode=decimal value="${m.f}"></div></div>
<button class=btn onclick="saveMeal('${id||''}')">Speichern</button>${id?`<button class="btn s" style="margin-top:8px" onclick="favMeal('${id}')">${ic('star')}Als Favorit speichern</button><button class="btn d" onclick="delMeal('${id}')">Löschen</button>`:''}`)}
function saveMeal(id){const o={name:val('mn').trim(),type:val('mt'),kcal:+val('mk')||0,p:+val('mp')||0,c:+val('mc')||0,f:+val('mf')||0,date:val('md'),time:val('mh')};if(!o.name||!o.date){toast('Bitte Name und Datum angeben');return}if(id)Object.assign(S.meals.find(x=>x.id===id),o);else S.meals.push({id:uid(),...o});done()}
function delMeal(id){if(confirm('Mahlzeit löschen?')){S.meals=S.meals.filter(x=>x.id!==id);done()}}
function favMeal(id){const m=S.meals.find(x=>x.id===id),{name,type,kcal,p,c,f}=m;S.favs.push({name,type,kcal,p,c,f});save();toast('Als Favorit gespeichert')}
function waterSheet(){sheet(`<h3>Wasser eintragen</h3><div class=g>${[150,250,330,500].map(n=>`<button class="btn s" onclick="addW(${n});closeS()">${n} ml</button>`).join('')}</div><label>Eigene Menge (ml)</label><input id=wm type=number inputmode=numeric><button class=btn onclick="addW(+val('wm'));closeS()">Hinzufügen</button>`)}
function addW(ml){if(!ml||ml<=0){toast('Bitte eine Menge angeben');return}S.water.push({id:uid(),date:tab===1?vd:today(),time:hm(),ml});save();render()}
function editW(id){const w=S.water.find(x=>x.id===id),n=+prompt('Menge in ml',w.ml);if(n>0){w.ml=n;save();render()}}
function delW(id){S.water=S.water.filter(x=>x.id!==id);save();render()}
/* Training */
const vol=w=>Math.round(w.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.kg||0)*(+s.reps||0),0),0));
function prs(){const P={};S.workouts.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(w=>w.ex.forEach(e=>{if(!e.sets.length)return;const mx=Math.max(...e.sets.map(s=>+s.kg||0)),p=P[e.name]||(P[e.name]={best:0,bd:'',last:0});if(mx>=p.best){p.best=mx;p.bd=w.date}p.last=mx}));return P}
function train(){const t=today(),wk=[0,1,2,3,4,5,6].map(i=>addD(t,i-((new Date().getDay()+6)%7))),P=prs(),H=S.workouts.slice().sort((a,b)=>a.date<b.date?1:-1);
return`<div class=top><h1>Training</h1></div><div class=c><button class=btn onclick="wEdit()">+ Neue Trainingseinheit</button></div><div class=c><b>Diese Woche</b><div class=cg style="margin-top:8px">${wk.map(d=>`<b>${DN[parse(d).getDay()]}</b>`).join('')}${wk.map(d=>`<div class="cd ${S.workouts.some(w=>w.date===d)?'dn':''} ${d===t?'td':''}" style="display:flex;align-items:center;justify-content:center">${S.workouts.some(w=>w.date===d)?'✓':parse(d).getDate()}</div>`).join('')}</div></div>
<div class=c><b>Bestleistungen</b>${Object.keys(P).map(n=>`<div class=row><span>${esc(n)}<br><span class=mu>zuletzt ${P[n].last} kg</span></span><b>${P[n].best} kg</b></div>`).join('')||'<p class=mu>Noch keine Übungen.</p>'}</div>
<div class=c><b>Verlauf</b>${H.map(w=>`<div class=row><span onclick="wEdit('${w.id}')">${w.date.split('-').reverse().join('.')} · ${esc(w.type)}<br><span class=mu>${w.dur} min · ${w.ex.length} Übungen · ${vol(w)} kg Volumen</span></span><button class="btn s q" onclick="wTpl('${w.id}')">Vorlage</button></div>`).join('')||'<p class=mu>Noch keine Einheiten.</p>'}<div class=mu>Kalorienverbrauch beim Sport wird nicht geschätzt und nicht von deinen Kalorien abgezogen.</div></div>`}

function saveWt(d,v){v=pk(v);if(!(v>20&&v<400)){toast('Bitte Gewicht in kg eingeben, z. B. 82,4');return}const e=S.wt.find(x=>x.date===d);if(e)e.kg=v;else S.wt.push({id:uid(),date:d,kg:v});save();toast(e?'Eintrag aktualisiert':'Gewicht gespeichert');render()}
function wtForm(id){const e=S.wt.find(x=>x.id===id)||{date:today(),kg:0};sheet(`<h3>Gewicht</h3><div class=nt>Pro Tag gibt es einen Eintrag. Ein neuer Wert für denselben Tag ersetzt den bestehenden.</div><label>Datum</label><input id=wd type=date value="${e.date}"><label>Gewicht (kg)</label><input id=wk inputmode=decimal placeholder="z. B. 82,4" value="${e.kg?fk(e.kg):''}"><button class=btn onclick="wtSave('${id||''}')">Speichern</button>${id?`<button class="btn d" onclick="wtDel('${id}')">Löschen</button>`:''}`)}
function wtSave(id){const v=pk(val('wk')),d=val('wd');if(!d||!(v>20&&v<400)){toast('Datum und Gewicht (kg) angeben');return}if(id)S.wt=S.wt.filter(x=>x.id!==id);S.wt=S.wt.filter(x=>x.date!==d);S.wt.push({id:id||uid(),date:d,kg:v});done()}
function wtDel(id){if(confirm('Eintrag löschen?')){S.wt=S.wt.filter(x=>x.id!==id);done()}}
function wsum(){const A=wts();if(!A.length)return'';const l=A[A.length-1],s=S.wg.start||A[0].kg;return`<div class=mu>Zuletzt ${fk(l.kg)} kg (${fd(l.date)}). Seit Start: ${sg(l.kg-s)} kg.</div><button class="btn s q" onclick="go(5)">${ic('chart')} Fortschritt</button>`}
function trend(A){const a=A.slice(-7),b=A.slice(-14,-7),m=x=>x.reduce((s,e)=>s+e.kg,0)/x.length;return A.length>=4&&b.length>=2?{d:m(a)-m(b)}:null}
function wsel(i){const e=WL[i];$('#wsl').textContent=fd(e.date)+': '+fk(e.kg)+' kg'}
function wchart(L){if(!L.length)return'<p class=mu>Noch keine Wiegeeinträge in diesem Zeitraum.</p>';WL=L;const w=340,h=170,px=34,py=14,g=S.wg.goal,ts=L.map(e=>parse(e.date).getTime()),t0=ts[0],t1=ts[ts.length-1],vs=L.map(e=>e.kg);let lo=Math.min(...vs,g||1e9),hi=Math.max(...vs,g||0);if(hi-lo<1){lo-=.5;hi+=.5}const X=t=>t1===t0?w/2:px+(t-t0)/(t1-t0)*(w-px-10),Y=v=>py+(hi-v)/(hi-lo)*(h-2*py),all=wts(),tr=L.map(e=>{const i=all.findIndex(x=>x.id===e.id),s=all.slice(Math.max(0,i-6),i+1);return s.reduce((a,x)=>a+x.kg,0)/s.length}),pl=a=>a.map((v,i)=>X(ts[i]).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"><text x=0 y=${py+4} font-size=10 fill="var(--mu)">${fk(hi)}</text><text x=0 y=${h-py+4} font-size=10 fill="var(--mu)">${fk(lo)}</text>${g&&g>=lo&&g<=hi?`<line x1=${px} x2=${w} y1=${Y(g)} y2=${Y(g)} stroke="var(--mu)" stroke-dasharray="2 4"/>`:''}${L.length>2?`<polyline points="${pl(tr)}" fill=none stroke="var(--wa)" stroke-width=1.5 stroke-dasharray="5 4"/>`:''}<polyline points="${pl(vs)}" fill=none stroke="var(--ac)" stroke-width=2 />${L.map((e,i)=>`<circle cx=${X(ts[i]).toFixed(1)} cy=${Y(e.kg).toFixed(1)} r=4 fill="var(--ac)"/><circle cx=${X(ts[i]).toFixed(1)} cy=${Y(e.kg).toFixed(1)} r=14 fill=transparent onclick="wsel(${i})"/>`).join('')}</svg><div id=wsl class=mu>Tippe auf einen Punkt für Datum und Gewicht.</div>`}
function wgt(){const A=wts(),t=today(),L=wr?A.filter(e=>e.date>=addD(t,1-wr)):A,l=A[A.length-1],pv=A[A.length-2],st=S.wg.start||(A[0]&&A[0].kg),zg=S.wg.goal,tr=trend(A),row=(a,b)=>`<div class=row><span>${a}</span><b>${b}</b></div>`,grp=(kf,n)=>{const m={};A.forEach(e=>(m[kf(e.date)]=m[kf(e.date)]||[]).push(e.kg));return Object.keys(m).sort().slice(-n).map(k=>({k,n:m[k].length,v:m[k].reduce((s,x)=>s+x,0)/m[k].length}))},gr=(a,lf)=>a.map((x,i)=>row(lf(x.k)+' <span class=mu>('+x.n+' Einträge)</span>','Ø '+fk(x.v)+' kg'+(i?' ('+sg(x.v-a[i-1].v)+')':''))).join('')||'<p class=mu>Noch keine Daten.</p>';
return`<div class=top><h1>Gewicht & Fortschritt</h1></div><div class=c><button class=btn onclick="wtForm()">${ic('plus')}Gewicht eintragen</button></div>
<div class=c>${[[7,'7 Tage'],[30,'30 Tage'],[90,'90 Tage'],[0,'Alles']].map(([n,x])=>`<button class="btn q ${wr===n?'':'s'}" onclick="wr=${n};render()">${x}</button>`).join('')}${wchart(L)}<div class=mu>Durchgezogen: deine echten Messwerte. Gestrichelt blau: Trend, der Durchschnitt der letzten bis zu 7 Einträge. Er glättet Tagesschwankungen. Tage ohne Eintrag werden nicht aufgefüllt.</div></div>
<div class=c><b>Kennzahlen</b>${l?row('Zuletzt eingetragen',fk(l.kg)+' kg')+row('Ausgangsgewicht',fk(st)+' kg')+row('Veränderung seit Start',sg(l.kg-st)+' kg ('+sg((l.kg-st)/st*100)+' %)')+row('Zielgewicht',zg?fk(zg)+' kg':'nicht festgelegt')+(zg?row('Abstand zum Ziel',(st>zg?l.kg<=zg:l.kg>=zg)?'Ziel erreicht':fk(Math.abs(l.kg-zg))+' kg'):'')+(pv?row('Gegenüber vorherigem Eintrag',sg(l.kg-pv.kg)+' kg'):''):'<p class=mu>Trage dein erstes Gewicht ein, dann erscheinen hier deine Kennzahlen.</p>'}${tr?`<div class=nt>Langfristiger Trend (Ø der letzten 7 Einträge gegenüber den 7 davor): ${Math.abs(tr.d)<.3?'ungefähr stabil':tr.d<0?'sinkend, '+sg(tr.d)+' kg':'steigend, '+sg(tr.d)+' kg'}. Das Gewicht schwankt im Alltag, einzelne Werte sagen wenig über Fett oder Muskeln aus.</div>`:A.length?'<div class=nt>Für einen Trend braucht es mindestens 4 Einträge.</div>':''}</div>
<div class=c><b>Start- und Zielgewicht</b><label>Ausgangsgewicht in kg (leer = erster Eintrag)</label><input inputmode=decimal value="${S.wg.start?fk(S.wg.start):''}" onchange="S.wg.start=pk(this.value)||null;save();render()"><label>Zielgewicht in kg</label><input inputmode=decimal value="${zg?fk(zg):''}" onchange="S.wg.goal=pk(this.value)||null;save();render()"></div>
<div class=c><b>Wochen</b> <span class=mu>(Durchschnitt, Veränderung zur vorherigen Zeile)</span>${gr(grp(d=>addD(d,-((parse(d).getDay()+6)%7)),8),x=>'ab '+parse(x).toLocaleDateString('de-DE',{day:'numeric',month:'short'}))}<br><b>Monate</b>${gr(grp(d=>d.slice(0,7),6),x=>parse(x+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'}))}</div>
<div class=c><b>Historie</b>${A.slice().reverse().map(e=>`<div class=row><span>${fd(e.date)}</span><span><b>${fk(e.kg)} kg</b> <button class="btn s q" onclick="wtForm('${e.id}')">${ic('pencil')}</button></span></div>`).join('')||'<p class=mu>Noch keine Einträge.</p>'}</div>`}
const V=[heute,ern,train,hab,str,wgt,stat,set],TL=['Heute','Ernährung','Training','Gewohnheiten','Streaks','Gewicht','Statistik','Einstellungen'],TI=['home','utensils','dumbbell','list','flame','scale','chart','sliders'];
function go(i){tab=i;render();$('#main').scrollTop=0}
function render(){const sc=$('#main').scrollTop;try{$('#main').innerHTML=V[tab]()}catch(e){$('#main').innerHTML='<div class=c>Fehler beim Anzeigen: '+esc(e.message)+'</div>'}$('#main').scrollTop=sc;$('#nav').innerHTML=TL.map((l,i)=>`<button class="${i===tab?'on':''}" onclick="go(${i})">${ic(TI[i])}${l}</button>`).join('')}
load();render();initIdb();addIcon();setInterval(chkRem,15000);
</script></body></html>
